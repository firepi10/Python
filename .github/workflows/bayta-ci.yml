name: bayta-ci

on:
  push:
    branches: ["claude/skylight-pi-os-build-uel868"]
    paths: ["bayta/**", ".github/workflows/bayta-ci.yml"]
  pull_request:
    paths: ["bayta/**", ".github/workflows/bayta-ci.yml"]

concurrency:
  group: bayta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bayta/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bayta/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bayta/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bayta/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

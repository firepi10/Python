name: bayta-image

on:
  workflow_dispatch:
  push:
    tags: ["bayta-v*"]
    # building the image takes ~an hour, so branch pushes only trigger it
    # when the image recipe itself changes
    branches: ["claude/skylight-pi-os-build-uel868"]
    paths:
      - "bayta/os/image/**"
      - ".github/workflows/bayta-image.yml"

permissions:
  contents: write

concurrency:
  group: bayta-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bayta/frontend/package-lock.json

      - name: Build frontend (so the image never needs Node)
        working-directory: bayta/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      # native pi-gen build: dependencies + arm64 emulation on the host, where
      # our binfmt registration is authoritative (the docker-wrapped action
      # resets binfmt itself and breaks on current runner kernels)
      - name: Install pi-gen host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coreutils quilt parted qemu-user-static \
            debootstrap zerofree zip dosfstools libarchive-tools libcap2-bin \
            rsync xz-utils file curl bc xxd kmod udev binfmt-support pigz \
            arch-test qemu-utils

      - name: Verify arm64 emulation works
        run: |
          arch-test arm64
          docker run --rm --platform linux/arm64 debian:bookworm uname -m

      - name: Assemble custom pi-gen stage
        run: |
          cp -a bayta/os/image/stage-bayta ./stage-bayta
          mkdir -p stage-bayta/00-install-bayta/files
          rsync -a \
            --exclude node_modules \
            --exclude .venv \
            --exclude var \
            --exclude artifacts \
            --exclude dist-demo \
            bayta/ stage-bayta/00-install-bayta/files/bayta/
          chmod +x stage-bayta/prerun.sh stage-bayta/00-install-bayta/*.sh
          chmod +x stage-bayta/00-install-bayta/files/bayta/os/install.sh

      - name: Clone and configure pi-gen
        run: |
          git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git
          cp -a stage-bayta pi-gen/stage-bayta
          cat > pi-gen/config <<'EOF'
          IMG_NAME="bayta"
          RELEASE="bookworm"
          DEPLOY_COMPRESSION="xz"
          COMPRESSION_LEVEL=6
          TARGET_HOSTNAME="bayta"
          FIRST_USER_NAME="pi"
          FIRST_USER_PASS="bayta"
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=1
          LOCALE_DEFAULT="en_US.UTF-8"
          KEYBOARD_KEYMAP="us"
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT="America/New_York"
          STAGE_LIST="stage0 stage1 stage2 stage-bayta"
          EOF

      - name: Build image (native pi-gen)
        run: |
          cd pi-gen
          sudo ./build.sh

      - name: Collect image
        id: build
        run: |
          IMG=$(ls pi-gen/deploy/*.img.xz | head -1)
          echo "found: $IMG"
          echo "image-path=$IMG" >> "$GITHUB_OUTPUT"

      - name: Checksum
        run: |
          sha256sum "${{ steps.build.outputs.image-path }}" | tee bayta-image.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayta-sd-card-image
          path: |
            ${{ steps.build.outputs.image-path }}
            bayta-image.sha256
          retention-days: 90

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/bayta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.image-path }}
            bayta-image.sha256

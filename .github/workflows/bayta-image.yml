name: bayta-image

on:
  workflow_dispatch:
  push:
    tags: ["bayta-v*"]
    # building the image takes ~an hour, so branch pushes only trigger it
    # when the image recipe itself changes
    branches: ["claude/skylight-pi-os-build-uel868"]
    paths:
      # the whole app is baked into the card, not just the OS layer. Scoping
      # this to os/** meant a frontend-only fix — the kind that decides whether
      # the UI is usable at all — reached existing Pis through the daily
      # self-update but never appeared in a freshly flashed image.
      - "bayta/os/**"
      - "bayta/backend/**"
      - "bayta/frontend/**"
      - ".github/workflows/bayta-image.yml"

permissions:
  contents: write

concurrency:
  group: bayta-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bayta/frontend/package-lock.json

      - name: Build frontend (so the image never needs Node)
        working-directory: bayta/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      # native pi-gen build: dependencies + arm64 emulation on the host, where
      # our binfmt registration is authoritative (the docker-wrapped action
      # resets binfmt itself and breaks on current runner kernels)
      # debootstrap runs arm64 binaries inside a chroot, so the emulator must be
      # the STATIC one registered with binfmt's fix-binary flag (tonistiigi/binfmt
      # does exactly that) — the dynamic qemu can't resolve its libs in there
      - name: Enable arm64 emulation for chroots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support arch-test
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          arch-test arm64
          grep -l 'aarch64' /proc/sys/fs/binfmt_misc/* | head -3

      - name: Assemble custom pi-gen stage
        run: |
          cp -a bayta/os/image/stage-bayta ./stage-bayta
          mkdir -p stage-bayta/00-install-bayta/files
          rsync -a \
            --exclude node_modules \
            --exclude .venv \
            --exclude var \
            --exclude artifacts \
            --exclude dist-demo \
            bayta/ stage-bayta/00-install-bayta/files/bayta/
          chmod +x stage-bayta/prerun.sh stage-bayta/00-install-bayta/*.sh
          chmod +x stage-bayta/00-install-bayta/files/bayta/os/install.sh

      - name: Clone and configure pi-gen
        run: |
          # bookworm-arm64 pairs 64-bit with the Bookworm packages Bayta is
          # tested against; the plain arm64 branch now defaults to trixie
          git clone --depth 1 --branch bookworm-arm64 \
            https://github.com/RPi-Distro/pi-gen.git
          cp -a stage-bayta pi-gen/stage-bayta
          cat > pi-gen/config <<'EOF'
          IMG_NAME="bayta"
          RELEASE="bookworm"
          DEPLOY_COMPRESSION="xz"
          COMPRESSION_LEVEL=6
          TARGET_HOSTNAME="bayta"
          FIRST_USER_NAME="pi"
          FIRST_USER_PASS="bayta"
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=1
          LOCALE_DEFAULT="en_US.UTF-8"
          KEYBOARD_KEYMAP="us"
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT="America/Chicago"
          # without a regulatory domain the kernel hard-blocks the Wi-Fi radio
          # via rfkill, so a card flashed without Imager's country setting can
          # never join a network. Imager's own setting overrides this.
          WPA_COUNTRY="US"
          STAGE_LIST="stage0 stage1 stage2 stage-bayta"
          EOF

      # the containerised build is pi-gen's supported path for non-ARM hosts:
      # it carries its own toolchain and runs privileged for the chroot mounts
      - name: Build image (pi-gen in Docker)
        run: |
          cd pi-gen
          sudo ./build-docker.sh

      - name: Collect image
        id: build
        run: |
          ls -la pi-gen/deploy/ || true
          # the containerised build writes as root:root — take the group too,
          # or tools that copy source attributes (xz) fail trying to chgrp back
          sudo chown -R "$USER:$(id -gn)" pi-gen/deploy
          # pi-gen exports one image per EXPORT_IMAGE stage: stage2 produces
          # "...-lite" (plain Raspberry Pi OS) and stage-bayta produces the
          # real one. Never use `ls | head -1` here — "-" sorts before "." so
          # the lite image wins and we ship an OS with no Bayta on it.
          IMG=$(ls pi-gen/deploy/*.img.xz | grep -v -- '-lite' | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::no Bayta image in deploy/ (only the lite export?)"
            exit 1
          fi
          echo "found: $IMG"
          echo "image-path=$IMG" >> "$GITHUB_OUTPUT"

      # never ship an unverified image again: prove it has both partitions,
      # the Pi firmware, and Bayta itself before it leaves the runner
      - name: Verify the image is bootable and contains Bayta
        run: |
          set -euo pipefail
          sudo rm -rf pi-gen/work          # reclaim space before decompressing
          df -h /
          IMG="${{ steps.build.outputs.image-path }}"
          RAW="${IMG%.xz}"
          # decompress via stdout: never copies the source file's ownership
          xz -dc -T0 "$IMG" > "$RAW"
          ls -l "$RAW"

          echo "--- partition table ---"
          sfdisk --json "$RAW" | tee /tmp/parts.json
          COUNT=$(jq '.partitiontable.partitions | length' /tmp/parts.json)
          [ "$COUNT" -ge 2 ] || { echo "::error::expected 2 partitions, got $COUNT"; exit 1; }

          BOOT_OFF=$(( $(jq -r '.partitiontable.partitions[0].start' /tmp/parts.json) * 512 ))
          ROOT_OFF=$(( $(jq -r '.partitiontable.partitions[1].start' /tmp/parts.json) * 512 ))

          echo "--- boot partition ---"
          mkdir -p /tmp/p1 /tmp/p2
          sudo mount -o loop,ro,offset="$BOOT_OFF" "$RAW" /tmp/p1
          ls /tmp/p1
          for f in start4.elf fixup4.dat kernel8.img config.txt cmdline.txt; do
            [ -f "/tmp/p1/$f" ] || { echo "::error::boot partition missing $f"; exit 1; }
          done
          sudo umount /tmp/p1

          echo "--- root partition ---"
          sudo mount -o loop,ro,offset="$ROOT_OFF" "$RAW" /tmp/p2
          for p in etc/systemd/system/bayta-backend.service \
                   etc/systemd/system/bayta-update.timer \
                   home/bayta/.config/labwc/autostart; do
            [ -e "/tmp/p2/$p" ] || { echo "::error::rootfs missing $p"; exit 1; }
          done
          # /opt/bayta/current is a symlink to an ABSOLUTE path, so it resolves
          # against the runner's root when mounted here — re-root it by hand
          RELEASE=$(readlink "/tmp/p2/opt/bayta/current") \
            || { echo "::error::/opt/bayta/current is not a symlink"; exit 1; }
          echo "release: $RELEASE"
          for p in backend/app/main.py frontend/dist/index.html venv/bin/uvicorn; do
            [ -e "/tmp/p2${RELEASE}/$p" ] || { echo "::error::release missing $p"; exit 1; }
          done
          # the kiosk browser and compositor ARE the appliance; without them the
          # Pi boots to a black screen with a cursor and says nothing about why
          ls /tmp/p2/usr/bin/chromium* 2>/dev/null || true
          [ -x /tmp/p2/usr/bin/chromium-browser ] || [ -x /tmp/p2/usr/bin/chromium ] \
            || { echo "::error::no chromium in the image — kiosk cannot start"; exit 1; }
          [ -x /tmp/p2/usr/bin/labwc ] \
            || { echo "::error::no labwc in the image — no compositor"; exit 1; }
          sudo umount /tmp/p2

          rm -f "$RAW"
          echo "image verified: 2 partitions, Pi firmware present, Bayta installed"

      - name: Checksum
        run: |
          SUM=$(sha256sum "${{ steps.build.outputs.image-path }}")
          echo "$SUM"
          {
            echo "### Bayta SD-card image"
            echo ""
            echo 'Unzip the artifact, then in Raspberry Pi Imager choose'
            echo '**Use custom** and select the `.img.xz` file itself.'
            echo ""
            echo '```'
            echo "$SUM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # exactly ONE file in the artifact: unzipping must yield the .img.xz and
      # nothing else, or Imager can't tell which entry is the image
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayta-sd-card-image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 90

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/bayta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
